plugins {
    id 'java'
}

group = 'com.wardensmp'
version = '1.0'

repositories {
    mavenCentral()
    // PaperMC's official, highly active repository hub
    maven { url = 'https://papermc.io' }
}

dependencies {
    // Downloads the stable Paper library for version 1.20.4
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


