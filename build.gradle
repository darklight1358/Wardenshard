plugins {
    id 'java'
}

group = 'com.wardensmp'
version = '1.0'

repositories {
    mavenCentral()
    // The only working repository link we need
    maven { url = 'https://spigotmc.org' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

